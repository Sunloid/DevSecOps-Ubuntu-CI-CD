# BASELINE - intentionally insecure (V28)
services:
  app:
    build: .
    image: practice-server:latest
    restart: always
    user: non-root                      
    cap_add:
      - SYS_ADMIN
    ports:
      - "127.0.0.1:3000:3000"                          # [V28] binds 0.0.0.0 and bypasses UFW via Docker's iptables rules
    environment:
      JWT_SECRET: ${JWT_SECRET}            # [V28] inline secrets
      DB_PASSWORD: ${DB_PASSWORD}
